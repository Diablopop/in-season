<!doctype html>
<html lang="en">
  <head>
    <!-- Cover artwork, so it is on its way before the stylesheet asks for it.
         Public paths are not content-hashed, so these can be written here. -->
    <link rel="preload" as="image" href="/img/cover/paper.webp" />
    <link rel="preload" as="image" href="/img/cover/apple.webp" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>In Season | A guide to what’s good today</title>
    <meta name="description" content="Get instant answers while you shop on which Southern California fruits are at their peak and which to skip." />

    <!-- Light only, declared three ways so neither OS applies its own dark treatment. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <!-- iOS ignores the manifest for icons and needs this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="In Season" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="In Season | A guide to what’s good today" />
    <meta property="og:description" content="Find out which SoCal fruits are at their peak and which to skip" />
    <meta property="og:url" content="https://in-season-grocery.vercel.app/" />
    <meta property="og:site_name" content="In Season" />
    <!-- Absolute, not relative: several crawlers will not resolve a relative
         og:image and will show no preview at all. -->
    <meta property="og:image" content="https://in-season-grocery.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A watercolor apple beside the words In Season." />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Cover screen. See SPLASH.md.

      Inline and static rather than a React component, because a component
      cannot paint until the bundle parses — a cold load would flash white
      before the cream, which is the exact artifact this exists to avoid. Its
      tokens live here rather than in tokens.css for the same reason: that
      stylesheet has not loaded at first paint.
    -->
    <style>
      :root {
        /* Cover stock. The only cream in the product — the pages stay pure
           white (PRD §8.6). A cover is different stock from the pages. */
        --cover-paper: #f5ead7;
        --cover-ink: #1a1714; /* mirrors --color-ink */
        --cover-hold: 500ms;
        --cover-fade: 550ms;
      }

      .cover {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* The flat cream stays underneath as the fallback: if the texture
           fails to load the cover is plain paper-coloured, not broken. */
        background-color: var(--cover-paper);
        background-image: url('/img/cover/paper.webp');
        background-size: cover;
        background-position: center;
        text-align: center;
        /* Shorthand order is duration then delay: hold, then fade. The whole
           thing is over in 900ms. Fill mode forwards is what makes this safe
           without script — the end state persists. */
        animation: cover-out var(--cover-fade) ease-in var(--cover-hold) forwards;
      }

      /*
        Sized against the viewport with a ceiling, so it holds its proportion
        on a small phone without becoming absurd on a large one. The master is
        trimmed to the fruit, so this is the apple's own size rather than the
        size of transparent margin around it.
      */
      .cover__apple {
        /*
          Three ceilings, and the smallest wins. 52vw sets the proportion, 250px
          stops it growing absurd on a large phone, and 36vh keeps the whole
          composition inside a short screen — a phone held in landscape is still
          a phone and still gets a cover, and without the last term the apple,
          wordmark and date come to about 376px of content in a 375px viewport.
          Sizing by width alone keeps the aspect ratio intact.
        */
        width: min(52vw, 250px, 36vh);
        height: auto;
        margin-bottom: 1.5rem;
      }

      /* Not an h1: the app has one, and two would be a worse outline for the
         sake of a decorative screen that is aria-hidden anyway. */
      .cover__title {
        margin: 0;
        font-family: 'Cover Serif', Georgia, 'Times New Roman', serif;
        font-weight: 600;
        font-size: 2.75rem;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--cover-ink);
      }

      /* visibility, not just opacity: it takes the cover out of hit-testing at
         the end of the animation, so a script failure cannot leave an
         invisible sheet swallowing taps. */
      @keyframes cover-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      /*
        Two conditions under which there is no cover at all.

        Reduced motion: a full-screen cross-fade is precisely what that
        preference asks to be spared, so skip it rather than shorten it.

        A mouse: a cover screen on a desktop reads as old-fashioned, and the
        drama here is for a phone in a store. Keyed to the pointer rather than
        the window width, because width gets both edges wrong — a desktop
        browser dragged narrow is still a desktop, and a phone held in
        landscape is still a phone.

        Either way the script below sees display: none and removes the node
        immediately, so this needs no JavaScript of its own.
      */
      @media (prefers-reduced-motion: reduce), (hover: hover) and (pointer: fine) {
        .cover { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="cover" id="cover" aria-hidden="true">
      <img class="cover__apple" src="/img/cover/apple.webp" alt="" width="922" height="1024" />
      <p class="cover__title">In Season</p>
    </div>
    <script>
      // Progressive enhancement only. The CSS above already clears the cover;
      // this adds skip-on-interaction and removes the dead node.
      ;(function () {
        var el = document.getElementById('cover')
        if (!el) return

        var done = false
        function clear() {
          if (done) return
          done = true
          el.remove()
        }

        // The cost of the cover to someone in a hurry should be one tap.
        // Cancel the running animation, pin the opacity it had reached, then
        // transition from there — otherwise the restart jumps back to full.
        function skip() {
          if (done) return
          var reached = getComputedStyle(el).opacity
          el.style.animation = 'none'
          el.style.opacity = reached
          // Cancelling the animation also cancels the visibility: hidden its
          // last keyframe would have applied, so the cover would stay
          // hit-testable at opacity 0 until the backstop fired — an invisible
          // sheet swallowing the next tap. Drop it here instead.
          el.style.pointerEvents = 'none'
          void el.offsetWidth // force reflow so the new transition takes
          el.style.transition = 'opacity 150ms linear'
          el.style.opacity = '0'
        }

        el.addEventListener('animationend', clear)
        el.addEventListener('transitionend', clear)
        addEventListener('pointerdown', skip, { once: true })
        addEventListener('keydown', skip, { once: true })

        // Reduced motion hides the cover outright, so no animation ever fires
        // and nothing above would remove it.
        if (getComputedStyle(el).display === 'none') clear()

        // Backstop. Nothing above should be able to strand the cover, but the
        // consequence of being wrong is an app the shopper cannot use.
        setTimeout(clear, 3000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
